# Run manually from the GitHub Actions page.
name: TXT-JSON-Binary

on:
  workflow_dispatch:

permissions:
  contents: write

# 与 Merge Rules 共用分支写入队列。
concurrency:
  group: rule-updates-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  convert_and_compile:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          # Queued runs should build the latest rules on this branch.
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Convert TXT rules to JSON and SRS
        run: |
          set -euo pipefail

          # 由转换器统一负责暂存、全量预检和原子替换，避免 cp 跟随输出软链接。
          # sing-box 无 USER-AGENT 对应字段，显式跳过并记录数量。
          python scripts/convert_txt_to_json.py --skip-unsupported-type USER-AGENT

      - name: Commit changed JSON and SRS together
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # 从转换器读取唯一的分类清单；全部产物有效后才允许暂存。
          output_list="$(mktemp)"
          trap 'rm -f -- "$output_list"' EXIT
          python - <<'PY' > "$output_list"
          import sys
          from pathlib import Path
          from runpy import run_path

          rule_names = run_path("scripts/convert_txt_to_json.py")["RULE_NAMES"]
          for name in rule_names:
              for extension in ("json", "srs"):
                  output = Path(f"{name}.{extension}")
                  if output.is_symlink() or not output.is_file() or output.stat().st_size == 0:
                      raise SystemExit(f"Missing or invalid rule output: {output}")
                  sys.stdout.buffer.write(str(output).encode("utf-8") + b"\0")
          PY
          mapfile -d '' -t output_files < "$output_list"
          git --literal-pathspecs add -- "${output_files[@]}"

          if git diff --cached --quiet; then
            echo "No rule output changes."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update JSON and SRS rule sets'
          # Fail safely if the branch changed during compilation; never force push
          # or rebase old generated output onto newer source rules.
          git push origin "HEAD:$TARGET_REF"
